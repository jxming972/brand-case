# ==================== 数据库连接配置 ====================
# 驱动类 -- MySQL 8.x 用 cj.jdbc, 5.x 用 jdbc
driverClassName=com.mysql.cj.jdbc.Driver
# 连接 URL -- 改成本机地址和库名
url=jdbc:mysql://localhost:3306/brand_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true
# 用户名 -- 改成你自己的
username=root
# 密码 -- 改成你自己的
password=123456

# ==================== Druid 连接池配置 ====================
# 初始连接数
initialSize=5
# 最大连接数
maxActive=10
# 最大等待时间（毫秒）
maxWait=3000
