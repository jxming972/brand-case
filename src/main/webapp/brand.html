<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>品牌管理</title>

    <!-- ========== 1. Element UI 样式（CDN） ========== -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-ui/lib/theme-chalk/index.css">

    <style>
        /* 页面整体布局 */
        body {
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }

        .brand-container {
            max-width: 1200px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 4px;
        }

        /* 搜索区域 */
        .search-box {
            margin-bottom: 20px;
        }
        .search-box .el-form-item {
            margin-bottom: 0;
        }

        /* 工具栏 */
        .toolbar {
            margin-bottom: 20px;
        }

        /* 状态开关文字 */
        .status-text {
            font-size: 13px;
        }
        .status-text.enabled {
            color: #67C23A;
        }
        .status-text.disabled {
            color: #F56C6C;
        }

        /* 分页条 */
        .pagination-wrap {
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

<div id="app" class="brand-container">

    <!-- ==================== 搜索栏 ==================== -->
    <div class="search-box">
        <el-form :inline="true" :model="searchForm" size="small">
            <el-form-item label="品牌名称">
                <el-input v-model="searchForm.brandName"
                          placeholder="请输入品牌名称"
                          clearable>
                </el-input>
            </el-form-item>

            <el-form-item label="企业名称">
                <el-input v-model="searchForm.companyName"
                          placeholder="请输入企业名称"
                          clearable>
                </el-input>
            </el-form-item>

            <el-form-item label="状态">
                <el-select v-model="searchForm.status"
                           placeholder="请选择状态"
                           clearable>
                    <el-option label="启用" :value="1"></el-option>
                    <el-option label="禁用" :value="0"></el-option>
                </el-select>
            </el-form-item>

            <el-form-item>
                <el-button type="primary" @click="search">查询</el-button>
                <el-button @click="resetSearch">重置</el-button>
            </el-form-item>
        </el-form>
    </div>

    <!-- ==================== 工具栏 ==================== -->
    <div class="toolbar">
        <el-button type="primary" size="small" @click="showAddDialog">新增品牌</el-button>
        <el-button type="danger"  size="small"
                   :disabled="selectedIds.length === 0"
                   @click="batchDelete">
            批量删除
        </el-button>
    </div>

    <!-- ==================== 品牌表格 ==================== -->
    <el-table :data="tableData"
              border
              stripe
              style="width: 100%"
              @selection-change="handleSelectionChange">
        <!-- 复选框列 -->
        <el-table-column type="selection" width="50" align="center"></el-table-column>

        <el-table-column prop="id"         label="序号"   width="80"  align="center"></el-table-column>
        <el-table-column prop="brandName"  label="品牌名称" width="150" align="center"></el-table-column>
        <el-table-column prop="companyName" label="企业名称" width="200" align="center"></el-table-column>
        <el-table-column prop="ordered"    label="排序"    width="100" align="center"></el-table-column>
        <el-table-column prop="description" label="描述"   show-overflow-tooltip></el-table-column>

        <!-- 状态列：用 switch 组件显示 -->
        <el-table-column label="状态" width="100" align="center">
            <template slot-scope="scope">
                <el-switch v-model="scope.row.status"
                           :active-value="1"
                           :inactive-value="0"
                           @change="changeStatus(scope.row)">
                </el-switch>
            </template>
        </el-table-column>

        <!-- 操作列 -->
        <el-table-column label="操作" width="150" align="center">
            <template slot-scope="scope">
                <el-button type="text" size="small" @click="showEditDialog(scope.row)">编辑</el-button>
                <el-divider direction="vertical"></el-divider>
                <el-button type="text" size="small"
                           style="color: #F56C6C;"
                           @click="deleteBrand(scope.row.id)">
                    删除
                </el-button>
            </template>
        </el-table-column>
    </el-table>

    <!-- ==================== 分页条 ==================== -->
    <div class="pagination-wrap">
        <el-pagination
                background
                layout="total, sizes, prev, pager, next, jumper"
                :current-page.sync="page"
                :page-sizes="[5, 10, 20]"
                :page-size.sync="pageSize"
                :total="totalCount"
                @size-change="handleSizeChange"
                @current-change="handlePageChange">
        </el-pagination>
    </div>

    <!-- ==================== 新增/编辑对话框 ==================== -->
    <el-dialog :title="dialogTitle"
               :visible.sync="dialogVisible"
               width="500px"
               @close="resetForm">
        <el-form ref="brandForm"
                 :model="brandForm"
                 :rules="rules"
                 label-width="80px"
                 size="small">
            <el-form-item label="品牌名称" prop="brandName">
                <el-input v-model="brandForm.brandName"
                          placeholder="请输入品牌名称">
                </el-input>
            </el-form-item>

            <el-form-item label="企业名称" prop="companyName">
                <el-input v-model="brandForm.companyName"
                          placeholder="请输入企业名称">
                </el-input>
            </el-form-item>

            <el-form-item label="排序" prop="ordered">
                <el-input-number v-model="brandForm.ordered"
                                 :min="0"
                                 :max="9999"
                                 controls-position="right">
                </el-input-number>
            </el-form-item>

            <el-form-item label="描述">
                <el-input v-model="brandForm.description"
                          type="textarea"
                          :rows="3"
                          placeholder="请输入品牌描述">
                </el-input>
            </el-form-item>

            <el-form-item label="状态">
                <el-switch v-model="brandForm.status"
                           :active-value="1"
                           :inactive-value="0">
                </el-switch>
            </el-form-item>
        </el-form>

        <span slot="footer">
            <el-button size="small" @click="dialogVisible = false">取消</el-button>
            <el-button size="small" type="primary" @click="submitForm">确定</el-button>
        </span>
    </el-dialog>

</div>

<!-- ========== 2. Vue（Element UI 依赖） ========== -->
<script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
<!-- ========== 3. Element UI 组件库 ========== -->
<script src="https://cdn.jsdelivr.net/npm/element-ui/lib/index.js"></script>
<!-- ========== 4. Axios ========== -->
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<script>
    new Vue({
        el: '#app',
        data: {
            tableData: [],
            selectedIds: [],
            page: 1,
            pageSize: 5,
            totalCount: 0,
            searchForm: { brandName: '', companyName: '', status: null },
            dialogVisible: false,
            dialogTitle: '新增品牌',
            brandForm: { id: null, brandName: '', companyName: '', ordered: 0, description: '', status: 1 },
            rules: {
                brandName:    [{ required: true, message: '请输入品牌名称', trigger: 'blur' }],
                companyName: [{ required: true, message: '请输入企业名称', trigger: 'blur' }],
                ordered:     [{ required: true, message: '请选择排序', trigger: 'blur' }]
            }
        },

        mounted() {
            this.loadData();
        },

        methods: {

            // ==================== 加载数据（分页 + 条件查询） ====================
            loadData() {
                axios.post('/brand-case/brand/selectByPageAndCondition',
                    { brandName: this.searchForm.brandName,
                      companyName: this.searchForm.companyName,
                      status: this.searchForm.status },
                    { params: { currentPage: this.page, pageSize: this.pageSize } }
                ).then(resp => {
                    this.tableData = resp.data.rows;
                    this.totalCount = resp.data.totalCount;
                }).catch(() => {
                    this.$message.error('网络异常，请检查后端服务');
                });
            },

            // ==================== 搜索 / 重置 ====================
            search() {
                this.page = 1;
                this.loadData();
            },
            resetSearch() {
                this.searchForm = { brandName: '', companyName: '', status: null };
                this.page = 1;
                this.loadData();
            },

            // ==================== 分页 ====================
            handleSizeChange(val) {
                this.pageSize = val;
                this.page = 1;
                this.loadData();
            },
            handlePageChange(val) {
                this.page = val;
                this.loadData();
            },

            // ==================== 复选框 ====================
            handleSelectionChange(rows) {
                this.selectedIds = rows.map(r => r.id);
            },

            // ==================== 新增 ====================
            showAddDialog() {
                this.dialogTitle = '新增品牌';
                this.dialogVisible = true;
            },

            // ==================== 编辑回显 ====================
            showEditDialog(row) {
                this.dialogTitle = '编辑品牌';
                Object.assign(this.brandForm, row);
                this.dialogVisible = true;
            },

            // ==================== 提交表单（新增 / 编辑） ====================
            submitForm() {
                this.$refs.brandForm.validate(valid => {
                    if (!valid) return;
                    const url = this.brandForm.id ? '/brand-case/brand/update' : '/brand-case/brand/add';
                    axios.post(url, this.brandForm).then(res => {
                        if (res.data === 'success') {
                            this.$message.success(this.brandForm.id ? '修改成功' : '新增成功');
                            this.dialogVisible = false;
                            this.loadData();
                        } else {
                            this.$message.error('操作失败');
                        }
                    }).catch(() => {
                        this.$message.error('网络异常，请检查后端服务');
                    });
                });
            },

            // ==================== 单个删除 ====================
            deleteBrand(id) {
                this.$confirm('确定删除该品牌吗？', '提示', {
                    confirmButtonText: '确定',
                    cancelButtonText: '取消',
                    type: 'warning'
                }).then(() => {
                    axios.post('/brand-case/brand/deleteById', null, { params: { id: id } }).then(res => {
                        if (res.data === 'success') {
                            this.$message.success('删除成功');
                            this.loadData();
                        } else {
                            this.$message.error('删除失败');
                        }
                    }).catch(() => {
                        this.$message.error('网络异常，请检查后端服务');
                    });
                }).catch(() => {});
            },

            // ==================== 批量删除 ====================
            batchDelete() {
                if (this.selectedIds.length === 0) {
                    this.$message.warning('请至少选择一条数据');
                    return;
                }
                this.$confirm(`确定删除选中的 ${this.selectedIds.length} 条品牌吗？`, '提示', {
                    confirmButtonText: '确定',
                    cancelButtonText: '取消',
                    type: 'warning'
                }).then(() => {
                    axios.post('/brand-case/brand/deleteByIds', this.selectedIds).then(res => {
                        if (res.data === 'success') {
                            this.$message.success('批量删除成功');
                            this.loadData();
                        } else {
                            this.$message.error('批量删除失败');
                        }
                    }).catch(() => {
                        this.$message.error('网络异常，请检查后端服务');
                    });
                }).catch(() => {});
            },

            // ==================== 弹窗关闭时重置 ====================
            resetForm() {
                this.$refs.brandForm.resetFields();
                this.brandForm = { id: null, brandName: '', companyName: '', ordered: 0, description: '', status: 1 };
            }
        }
    });
</script>

</body>
</html>
